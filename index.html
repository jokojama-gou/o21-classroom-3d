<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>火を囲む教室 3D Web Experience</title>
  <!-- Google model-viewer (標準WebXR / AR対応 3Dビューア) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
      background: #0F172A; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    model-viewer {
      width: 100%; height: 100%;
      --poster-color: transparent;
    }
    .header {
      position: absolute; top: 20px; left: 24px; color: #FFFFFF; z-index: 10;
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px);
      padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: auto;
    }
    .header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: 0.04em; }
    .header p { margin: 4px 0 0; font-size: 0.8rem; color: #94A3B8; }
    .badge {
      display: inline-block; background: #EA580C; color: #FFF; font-size: 0.7rem; font-weight: 600;
      padding: 2px 8px; border-radius: 9999px; margin-bottom: 4px;
    }
    .controls {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 10;
    }
    .btn {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2); color: #FFFFFF;
      padding: 8px 18px; border-radius: 9999px; font-size: 0.82rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s ease;
    }
    .btn:hover { background: #EA580C; border-color: #EA580C; }
    .ar-prompt {
      position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.6); font-size: 0.75rem; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">SFC未来の教室コンテスト 2026</div>
    <h1>火を囲む教室 3D Experience</h1>
    <p>前をなくせば、先生も輪の一員になる ── 横山 豪</p>
  </div>

  <model-viewer
    id="viewer"
    src="https://dl.dropboxusercontent.com/scl/fi/veb7btmo4qrs2h0sd128j/o21_koagari_3d_space_model_20261118.glb?rlkey=yncq5ovdl6exwisombiq0p8j3&dl=1"
    alt="火を囲む教室 3D空間モデル"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    auto-rotate-delay="3000"
    rotation-per-second="15deg"
    shadow-intensity="1.2"
    shadow-softness="0.8"
    camera-orbit="45deg 70deg 7m"
    field-of-view="35deg">
  </model-viewer>

  <div class="ar-prompt">※マウスドラッグで全方位回転・スクロールで拡大縮小 / スマホならAR実物大配置対応</div>

  <div class="controls">
    <button class="btn" onclick="document.querySelector('#viewer').cameraOrbit = '45deg 70deg 7m'">全体パース</button>
    <button class="btn" onclick="document.querySelector('#viewer').cameraOrbit = '0deg 5deg 8.5m'">真上（平面）</button>
    <button class="btn" onclick="document.querySelector('#viewer').cameraOrbit = '90deg 82deg 3.8m'">中央ピット目線</button>
  </div>
</body>
</html>
